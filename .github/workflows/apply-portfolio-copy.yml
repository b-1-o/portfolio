name: Apply portfolio copy updates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update social links and project label
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import json

          path = Path('src/App.jsx')
          text = path.read_text()

          text = re.sub(r"\s*\{ label: 'TikTok',[^\n]*\},", '', text)
          text = re.sub(r"\s*\{ label: 'Instagram',[^\n]*\},", '', text)
          text = re.sub(
              r"\{ label: 'Telegram', href: '[^']*', note: '[^']*' \},",
              "{ label: 'Mail', href: 'mailto:l.biodev.l@gmail.com', note: 'l.biodev.l@gmail.com' },",
              text,
          )
          text = re.sub(
              r"\{ label: 'Mail', href: '[^']*', note: '[^']*' \},",
              "{ label: 'Mail', href: 'mailto:l.biodev.l@gmail.com', note: 'l.biodev.l@gmail.com' },",
              text,
          )
          text = re.sub(
              r"message directly on Telegram\.",
              "email me directly.",
              text,
          )
          text = re.sub(r"name: 'Portfolio'", "name: 'portfolio'", text)
          text = re.sub(r'name: "Portfolio"', 'name: "portfolio"', text)
          text = re.sub(r"<h2>Projects</h2>", "<h2>portfolio</h2>", text)
          text = re.sub(r"<h2>Portfolio</h2>", "<h2>portfolio</h2>", text)

          path.write_text(text)

          auto = Path('src/projects.auto.json')
          if auto.exists():
              data = json.loads(auto.read_text())
              changed = False
              for item in data:
                  if item.get('name') == 'Portfolio':
                      item['name'] = 'portfolio'
                      if isinstance(item.get('blurb'), str) and item['blurb'].startswith('Portfolio'):
                          item['blurb'] = 'portfolio' + item['blurb'][len('Portfolio'):]
                      changed = True
              if changed:
                  auto.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/projects.auto.json
          git diff --cached --quiet && exit 0
          git commit -m "Update portfolio social links and project label"
          git push
